name: Build GemType Portable

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should the builder do?
        required: true
        default: portable-data
        type: choice
        options:
          - portable-data
          - inspect-source

      upstream_repo:
        description: Source repository (leave blank for YOUR-USERNAME/GemType)
        required: false
        default: ""

      upstream_ref:
        description: Source branch/tag/SHA
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: gemtype-portable-build
  cancel-in-progress: false

jobs:
  build:
    name: GemType Portable
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout portable-builder repository
        uses: actions/checkout@v7

      - name: Resolve source repository
        id: source
        shell: pwsh
        run: |
          $repo = "${{ inputs.upstream_repo }}"

          if ([string]::IsNullOrWhiteSpace($repo)) {
            $repo = "${{ github.repository_owner }}/GemType"
          }

          $ref = "${{ inputs.upstream_ref }}"

          if ([string]::IsNullOrWhiteSpace($ref)) {
            $ref = "main"
          }

          "repo=$repo" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT

          Write-Host "Source repository: $repo"
          Write-Host "Source ref:        $ref"

      - name: Checkout synced GemType fork
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.ref }}
          path: upstream
          fetch-depth: 1

      - name: Record source revision
        id: revision
        shell: pwsh
        run: |
          $rev = (git -C upstream rev-parse HEAD).Trim()
          "sha=$rev" >> $env:GITHUB_OUTPUT
          Write-Host "Source revision: $rev"

      - name: Inspect current desktop source
        if: ${{ inputs.mode == 'inspect-source' }}
        shell: pwsh
        run: |
          & .\scripts\Inspect-GemType-Desktop.ps1 `
            -SourceRoot "$PWD\upstream" `
            -OutputRoot "$PWD\artifact\GemType-Inspection"

      - name: Upload source inspection
        if: ${{ inputs.mode == 'inspect-source' }}
        uses: actions/upload-artifact@v4
        with:
          name: GemType-Desktop-Inspection-${{ steps.revision.outputs.sha }}
          path: artifact/GemType-Inspection/**
          if-no-files-found: error
          retention-days: 30

      - name: Setup Node 22
        if: ${{ inputs.mode == 'portable-data' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/desktop/package.json

      - name: Install GemType desktop dependencies
        if: ${{ inputs.mode == 'portable-data' }}
        working-directory: upstream/desktop
        shell: pwsh
        run: npm install

      - name: Run upstream desktop tests
        if: ${{ inputs.mode == 'portable-data' }}
        working-directory: upstream/desktop
        shell: pwsh
        run: npm test

      - name: Apply true-portable source patch
        if: ${{ inputs.mode == 'portable-data' }}
        shell: pwsh
        run: |
          & .\scripts\Apply-True-Portable-Patch.ps1 `
            -SourceRoot "$PWD\upstream"

      - name: Verify patched source
        if: ${{ inputs.mode == 'portable-data' }}
        shell: pwsh
        run: |
          & .\scripts\Verify-Portable-Source.ps1 `
            -SourceRoot "$PWD\upstream"

      - name: Build single portable Windows EXE
        if: ${{ inputs.mode == 'portable-data' }}
        working-directory: upstream/desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win portable --x64

      - name: Assemble portable package
        if: ${{ inputs.mode == 'portable-data' }}
        shell: pwsh
        run: |
          & .\scripts\Assemble-Portable.ps1 `
            -SourceRoot "$PWD\upstream" `
            -OutputRoot "$PWD\artifact\GemType-Portable" `
            -KitRoot "$PWD"

      - name: Upload portable build
        if: ${{ inputs.mode == 'portable-data' }}
        uses: actions/upload-artifact@v4
        with:
          name: GemType-Portable-Windows-x64-${{ steps.revision.outputs.sha }}
          path: artifact/GemType-Portable/**
          if-no-files-found: error
          retention-days: 30
